    <path d="M600,558 L580,599" stroke="#F2701C" stroke-width="1.6"/>
  </g>
  <circle cx="320" cy="439" r="4" fill="#12A187"/>
  <circle cx="580" cy="599" r="4" fill="#F2701C"/>

