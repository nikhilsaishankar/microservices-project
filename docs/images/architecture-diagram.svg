  <!-- 1. GitHub Repository -->
  <rect x="320" y="372" width="260" height="54" rx="10" fill="#FDE6E9" stroke="#E8A9B2" stroke-width="1.4"/>
  <circle cx="350" cy="399" r="17" fill="#24292F"/>
  <use href="#i-git" x="336" y="385" width="28" height="28" color="#FFFFFF"/>
  <text x="378" y="396" font-size="14.5" font-weight="800" fill="#14171C">GitHub Repository</text>
  <text x="378" y="413" font-size="10.5" fill="#6B7682">One branch per microservice</text>

  <path d="M440,433 L450,439 L460,433" fill="none" stroke="#14171C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M440,441 L450,447 L460,441" fill="none" stroke="#14171C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2. Multibranch Scan -->
  <rect x="320" y="452" width="260" height="54" rx="10" fill="#FDE6E9" stroke="#E8A9B2" stroke-width="1.4"/>
  <circle cx="350" cy="479" r="17" fill="#D24939"/>
  <use href="#i-scan" x="336" y="465" width="28" height="28" color="#FFFFFF"/>
  <text x="378" y="476" font-size="14.5" font-weight="800" fill="#14171C">Multibranch Scan</text>
  <text x="378" y="493" font-size="10.5" fill="#6B7682">Re-indexes every branch on a scan</text>

  <path d="M440,513 L450,519 L460,513" fill="none" stroke="#14171C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M440,521 L450,527 L460,521" fill="none" stroke="#14171C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3. Per-Branch Build -->
  <rect x="320" y="532" width="260" height="54" rx="10" fill="#FDE6E9" stroke="#E8A9B2" stroke-width="1.4"/>
  <circle cx="350" cy="559" r="17" fill="#F2701C"/>
  <use href="#i-terminal" x="336" y="545" width="28" height="28" color="#FFFFFF"/>
  <text x="378" y="556" font-size="14.5" font-weight="800" fill="#14171C">Per-Branch Build</text>
  <text x="378" y="573" font-size="10.5" fill="#6B7682">Jenkinsfile: docker build &amp;&amp; push</text>

  <path d="M440,593 L450,599 L460,593" fill="none" stroke="#14171C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M440,601 L450,607 L460,601" fill="none" stroke="#14171C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

