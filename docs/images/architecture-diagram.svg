<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="grid-fine" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#EAF2FA" stroke-opacity="0.05" stroke-width="1"/>
