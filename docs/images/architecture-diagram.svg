  <text x="378" y="1005" font-size="10.5" fill="#6B7682">11 services + redis-cart</text>

  <line x1="450" y1="1018" x2="450" y2="1038" stroke="#9AA5B1" stroke-width="1.6"/>

  <!-- ================= INCLUDES ================= -->
  <rect x="170" y="1038" width="560" height="114" rx="10" fill="none" stroke="#B9C0C9" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="190" y="1064" font-size="13" font-weight="800" fill="#14171C">Includes:</text>
  <g font-size="12" fill="#4A525C">
    <text x="190" y="1090">&#8226; Deployment + ClusterIP Service</text>
    <text x="190" y="1112">&#8226; Namespace: webapps</text>
    <text x="190" y="1134">&#8226; Self-healing restarts (any)</text>
    <text x="460" y="1090">&#8226; LoadBalancer (frontend only)</text>
    <text x="460" y="1112">&#8226; kubeconfig via k8-token</text>
    <text x="460" y="1134">&#8226; EKS-1 managed control plane</text>
  </g>

  <!-- ================= FOUNDATION ================= -->
  <rect x="60" y="1192" width="780" height="200" rx="10" fill="none" stroke="#D8DEE5" stroke-width="1.4"/>
  <line x1="450" y1="1212" x2="450" y2="1372" stroke="#E9ECEF" stroke-width="1.3"/>
  <rect x="350" y="1177" width="200" height="32" rx="16" fill="#DCEBFC" stroke="#4C7FD6" stroke-width="1.3"/>
  <text x="450" y="1198" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1B3B73" letter-spacing="0.4">WHY THIS SCALES</text>

  <g font-size="12.5" fill="#2B3138">
    <circle cx="82" cy="1228" r="3.4" fill="#4C7FD6"/>
    <text x="94" y="1233">One Jenkinsfile per branch</text>
    <circle cx="82" cy="1256" r="3.4" fill="#4C7FD6"/>
    <text x="94" y="1261">Multibranch auto-discovery</text>
    <circle cx="82" cy="1284" r="3.4" fill="#4C7FD6"/>
    <text x="94" y="1289">Scan-triggered, not full rebuild</text>
    <circle cx="82" cy="1312" r="3.4" fill="#4C7FD6"/>
    <text x="94" y="1317">Shared executor pool queues builds</text>
    <circle cx="82" cy="1340" r="3.4" fill="#4C7FD6"/>
    <text x="94" y="1345">Independent per-service images</text>

    <circle cx="472" cy="1228" r="3.4" fill="#4C7FD6"/>
    <text x="484" y="1233">One Docker Hub repo per service</text>
    <circle cx="472" cy="1256" r="3.4" fill="#4C7FD6"/>
    <text x="484" y="1261">Kubernetes Deployments + Services</text>
    <circle cx="472" cy="1284" r="3.4" fill="#4C7FD6"/>
    <text x="484" y="1289">Namespace isolation (webapps)</text>
    <circle cx="472" cy="1312" r="3.4" fill="#4C7FD6"/>
    <text x="484" y="1317">frontend exposed via LoadBalancer</text>
    <circle cx="472" cy="1340" r="3.4" fill="#4C7FD6"/>
    <text x="484" y="1345">EKS-1 in ap-south-1 (eksctl)</text>
  </g>

  <!-- ================= SUMMARY STRIP ================= -->
  <rect x="60" y="1412" width="780" height="60" rx="8" fill="#FAFAFA" stroke="#14171C" stroke-width="1.3"/>
  <text x="450" y="1438" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14171C">Build: only branches with new commits, one service at a time.</text>
  <text x="450" y="1457" text-anchor="middle" font-size="12" fill="#6B7682">Deploy: main branch rolls the shared manifest onto EKS &#8212; namespace webapps.</text>
