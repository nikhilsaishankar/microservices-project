  <circle cx="350" cy="639" r="17" fill="#2496ED"/>
  <use href="#i-layers" x="336" y="625" width="28" height="28" color="#FFFFFF"/>
  <text x="378" y="636" font-size="14.5" font-weight="800" fill="#14171C">Docker Hub</text>
  <text x="378" y="653" font-size="10.5" fill="#6B7682">nikhilkotharu/&lt;service&gt;:latest</text>

  <path d="M440,673 L450,679 L460,673" fill="none" stroke="#14171C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M440,681 L450,687 L460,681" fill="none" stroke="#14171C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 5. kubectl apply -->
  <rect x="320" y="692" width="260" height="54" rx="10" fill="#FDE6E9" stroke="#E8A9B2" stroke-width="1.4"/>
  <circle cx="350" cy="719" r="17" fill="#326CE5"/>
  <use href="#i-helm" x="336" y="705" width="28" height="28" color="#FFFFFF"/>
  <text x="378" y="716" font-size="14.5" font-weight="800" fill="#14171C">kubectl apply</text>
  <text x="378" y="733" font-size="10.5" fill="#6B7682">Rolls the manifest onto EKS-1</text>

  <path d="M440,753 L450,759 L460,753" fill="none" stroke="#14171C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M440,761 L450,767 L460,761" fill="none" stroke="#14171C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 6. Running Pods -->
  <rect x="320" y="772" width="260" height="54" rx="10" fill="#FDE6E9" stroke="#E8A9B2" stroke-width="1.4"/>
  <circle cx="350" cy="799" r="17" fill="#16A34A"/>
  <use href="#i-server" x="336" y="785" width="28" height="28" color="#FFFFFF"/>
  <text x="378" y="796" font-size="14.5" font-weight="800" fill="#14171C">Running Pods</text>
  <text x="378" y="813" font-size="10.5" fill="#6B7682">11 services + redis-cart</text>

  <line x1="450" y1="826" x2="450" y2="846" stroke="#9AA5B1" stroke-width="1.6"/>

  <!-- ================= INCLUDES ================= -->
  <rect x="170" y="846" width="560" height="114" rx="10" fill="none" stroke="#B9C0C9" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="190" y="872" font-size="13" font-weight="800" fill="#14171C">Includes:</text>
  <g font-size="12" fill="#4A525C">
    <text x="190" y="898">&#8226; Deployment + ClusterIP Service</text>
    <text x="190" y="920">&#8226; Namespace: webapps</text>
    <text x="190" y="942">&#8226; Self-healing restarts (any)</text>
    <text x="460" y="898">&#8226; LoadBalancer (frontend only)</text>
    <text x="460" y="920">&#8226; kubeconfig via k8-token</text>
    <text x="460" y="942">&#8226; EKS-1 managed control plane</text>
  </g>

  <!-- ================= FOUNDATION ================= -->
  <rect x="60" y="1000" width="780" height="200" rx="10" fill="none" stroke="#D8DEE5" stroke-width="1.4"/>
  <line x1="450" y1="1020" x2="450" y2="1180" stroke="#E9ECEF" stroke-width="1.3"/>
  <rect x="350" y="985" width="200" height="32" rx="16" fill="#DCEBFC" stroke="#4C7FD6" stroke-width="1.3"/>
  <text x="450" y="1006" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1B3B73" letter-spacing="0.4">WHY THIS SCALES</text>

  <g font-size="12.5" fill="#2B3138">
    <circle cx="82" cy="1036" r="3.4" fill="#4C7FD6"/>
    <text x="94" y="1041">One Jenkinsfile per branch</text>
    <circle cx="82" cy="1064" r="3.4" fill="#4C7FD6"/>
    <text x="94" y="1069">Multibranch auto-discovery</text>
    <circle cx="82" cy="1092" r="3.4" fill="#4C7FD6"/>
    <text x="94" y="1097">Scan-triggered, not full rebuild</text>
    <circle cx="82" cy="1120" r="3.4" fill="#4C7FD6"/>
    <text x="94" y="1125">Shared executor pool queues builds</text>
    <circle cx="82" cy="1148" r="3.4" fill="#4C7FD6"/>
    <text x="94" y="1153">Independent per-service images</text>

    <circle cx="472" cy="1036" r="3.4" fill="#4C7FD6"/>
    <text x="484" y="1041">One Docker Hub repo per service</text>
    <circle cx="472" cy="1064" r="3.4" fill="#4C7FD6"/>
    <text x="484" y="1069">Kubernetes Deployments + Services</text>
    <circle cx="472" cy="1092" r="3.4" fill="#4C7FD6"/>
    <text x="484" y="1097">Namespace isolation (webapps)</text>
    <circle cx="472" cy="1120" r="3.4" fill="#4C7FD6"/>
    <text x="484" y="1125">frontend exposed via LoadBalancer</text>
    <circle cx="472" cy="1148" r="3.4" fill="#4C7FD6"/>
    <text x="484" y="1153">EKS-1 in ap-south-1 (eksctl)</text>
  </g>

  <!-- ================= SUMMARY STRIP ================= -->
  <rect x="60" y="1220" width="780" height="60" rx="8" fill="#FAFAFA" stroke="#14171C" stroke-width="1.3"/>
  <text x="450" y="1246" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14171C">Build: only branches with new commits, one service at a time.</text>
  <text x="450" y="1265" text-anchor="middle" font-size="12" fill="#6B7682">Deploy: main branch rolls the shared manifest onto EKS &#8212; namespace webapps.</text>
</svg>
