  <path d="M443,293 L450,301 L457,293" fill="none" stroke="#E8632C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="466" y="286" font-size="11" fill="#8A93A1">git push</text>

