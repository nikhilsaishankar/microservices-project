<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <symbol id="i-push" viewBox="0 0 32 32">
      <line x1="16" y1="24" x2="16" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M9,17 L16,10 L23,17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="8" y1="25" x2="24" y2="25" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-scan" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <circle cx="16" cy="16" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.7"/>
      <line x1="16" y1="16" x2="24" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="16" cy="16" r="1.8" fill="currentColor"/>
    </symbol>
    <symbol id="i-terminal" viewBox="0 0 32 32">
      <rect x="5" y="7" width="22" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <path d="M10,13 l4,4 l-4,4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="17" y1="21" x2="22" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-layers" viewBox="0 0 32 32">
      <path d="M16,6 L27,12 L16,18 L5,12 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M5,17 L16,23 L27,17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5,22 L16,28 L27,22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-helm" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <circle cx="16" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <line x1="16" y1="6" x2="16" y2="12.9" stroke="currentColor" stroke-width="1.8"/>
      <line x1="16" y1="19.1" x2="16" y2="26" stroke="currentColor" stroke-width="1.8"/>
      <line x1="6" y1="16" x2="12.9" y2="16" stroke="currentColor" stroke-width="1.8"/>
      <line x1="19.1" y1="16" x2="26" y2="16" stroke="currentColor" stroke-width="1.8"/>
      <line x1="9.1" y1="9.1" x2="13.7" y2="13.7" stroke="currentColor" stroke-width="1.8"/>
      <line x1="18.3" y1="18.3" x2="22.9" y2="22.9" stroke="currentColor" stroke-width="1.8"/>
      <line x1="22.9" y1="9.1" x2="18.3" y2="13.7" stroke="currentColor" stroke-width="1.8"/>
      <line x1="13.7" y1="18.3" x2="9.1" y2="22.9" stroke="currentColor" stroke-width="1.8"/>
    </symbol>
    <symbol id="i-globe" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <ellipse cx="16" cy="16" rx="5" ry="11" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <line x1="5" y1="16" x2="27" y2="16" stroke="currentColor" stroke-width="1.4"/>
      <path d="M7,10 h18 M7,22 h18" fill="none" stroke="currentColor" stroke-width="1.2"/>
    </symbol>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1400" height="620" fill="#10141A"/>

  <!-- header -->
  <text x="40" y="42" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11.5" letter-spacing="2" fill="#2DD8B8">JENKINS MULTIBRANCH PIPELINE</text>
  <text x="40" y="76" font-size="25" font-weight="700" fill="#E7ECF2">How a push becomes a running service</text>
  <line x1="40" y1="98" x2="1360" y2="98" stroke="#2A313D" stroke-width="1"/>

  <!-- connecting belt line behind stage cards -->
  <line x1="40" y1="245" x2="1365" y2="245" stroke="#2A313D" stroke-width="2"/>

  <!-- ===================== STAGE CARDS ===================== -->
  <!-- Card 1: PUSH -->
  <g>
    <rect x="40" y="130" width="205" height="230" rx="10" fill="#181D26" stroke="#232A35" stroke-width="1.3"/>
    <circle cx="74" cy="168" r="18" fill="none" stroke="#2DD8B8" stroke-width="1.8"/>
    <use href="#i-push" x="60" y="154" width="28" height="28" color="#2DD8B8"/>
    <text x="58" y="222" font-size="16" font-weight="700" fill="#E7ECF2">Push</text>
    <text x="58" y="244" font-size="11.5" fill="#9AA5B1">Developer commits to</text>
    <text x="58" y="260" font-size="11.5" fill="#9AA5B1">one service's branch.</text>
    <line x1="58" y1="308" x2="227" y2="308" stroke="#232A35" stroke-width="1"/>
    <rect x="58" y="322" width="129" height="26" rx="13" fill="#10141A" stroke="#2A313D" stroke-width="1"/>
    <text x="122.5" y="339" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#C7CFD8">git push</text>
  </g>

  <!-- Card 2: SCAN -->
  <g>
    <rect x="264" y="130" width="205" height="230" rx="10" fill="#181D26" stroke="#232A35" stroke-width="1.3"/>
    <circle cx="298" cy="168" r="18" fill="none" stroke="#2DD8B8" stroke-width="1.8"/>
    <use href="#i-scan" x="284" y="154" width="28" height="28" color="#2DD8B8"/>
    <text x="282" y="222" font-size="16" font-weight="700" fill="#E7ECF2">Scan</text>
    <text x="282" y="244" font-size="11.5" fill="#9AA5B1">Jenkins re-indexes</text>
    <text x="282" y="260" font-size="11.5" fill="#9AA5B1">every branch on schedule.</text>
    <line x1="282" y1="308" x2="451" y2="308" stroke="#232A35" stroke-width="1"/>
    <rect x="282" y="322" width="163" height="26" rx="13" fill="#10141A" stroke="#2A313D" stroke-width="1"/>
    <text x="363.5" y="339" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#C7CFD8">Scan Multibranch Now</text>
  </g>

  <!-- Card 3: BUILD & PUSH -->
  <g>
    <rect x="488" y="130" width="205" height="230" rx="10" fill="#181D26" stroke="#2DD8B8" stroke-width="1.6"/>
    <circle cx="522" cy="168" r="18" fill="#123B34" stroke="#2DD8B8" stroke-width="1.8"/>
    <use href="#i-terminal" x="508" y="154" width="28" height="28" color="#2DD8B8"/>
    <text x="506" y="222" font-size="16" font-weight="700" fill="#E7ECF2">Build &amp; Push</text>
    <text x="506" y="244" font-size="11.5" fill="#9AA5B1">Only branches with new</text>
    <text x="506" y="260" font-size="11.5" fill="#9AA5B1">commits queue a build.</text>
    <line x1="506" y1="308" x2="675" y2="308" stroke="#2A313D" stroke-width="1"/>
    <rect x="506" y="322" width="163" height="26" rx="13" fill="#10141A" stroke="#2A313D" stroke-width="1"/>
    <text x="587.5" y="339" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#C7CFD8">docker build &amp;&amp; push</text>
  </g>

  <!-- Card 4: REGISTRY -->
  <g>
    <rect x="712" y="130" width="205" height="230" rx="10" fill="#181D26" stroke="#232A35" stroke-width="1.3"/>
    <circle cx="746" cy="168" r="18" fill="none" stroke="#5B8DEF" stroke-width="1.8"/>
    <use href="#i-layers" x="732" y="154" width="28" height="28" color="#5B8DEF"/>
    <text x="730" y="222" font-size="16" font-weight="700" fill="#E7ECF2">Registry</text>
    <text x="730" y="244" font-size="11.5" fill="#9AA5B1">Each image lands in</text>
    <text x="730" y="260" font-size="11.5" fill="#9AA5B1">its own Docker Hub repo.</text>
    <line x1="730" y1="308" x2="899" y2="308" stroke="#232A35" stroke-width="1"/>
    <rect x="730" y="322" width="163" height="26" rx="13" fill="#10141A" stroke="#2A313D" stroke-width="1"/>
    <text x="811.5" y="339" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#C7CFD8">nikhilkotharu/&lt;service&gt;</text>
  </g>

  <!-- Card 5: DEPLOY -->
  <g>
    <rect x="936" y="130" width="205" height="230" rx="10" fill="#181D26" stroke="#232A35" stroke-width="1.3"/>
    <circle cx="970" cy="168" r="18" fill="none" stroke="#5B8DEF" stroke-width="1.8"/>
    <use href="#i-helm" x="956" y="154" width="28" height="28" color="#5B8DEF"/>
    <text x="954" y="222" font-size="16" font-weight="700" fill="#E7ECF2">Deploy</text>
    <text x="954" y="244" font-size="11.5" fill="#9AA5B1">Main branch rolls the</text>
    <text x="954" y="260" font-size="11.5" fill="#9AA5B1">manifest onto EKS-1.</text>
    <line x1="954" y1="308" x2="1123" y2="308" stroke="#232A35" stroke-width="1"/>
    <rect x="954" y="322" width="163" height="26" rx="13" fill="#10141A" stroke="#2A313D" stroke-width="1"/>
    <text x="1035.5" y="339" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#C7CFD8">kubectl apply</text>
  </g>

  <!-- Card 6: LIVE -->
  <g>
    <rect x="1160" y="130" width="205" height="230" rx="10" fill="#181D26" stroke="#232A35" stroke-width="1.3"/>
    <circle cx="1194" cy="168" r="18" fill="none" stroke="#E8A15D" stroke-width="1.8"/>
    <use href="#i-globe" x="1180" y="154" width="28" height="28" color="#E8A15D"/>
    <text x="1178" y="222" font-size="16" font-weight="700" fill="#E7ECF2">Live</text>
    <text x="1178" y="244" font-size="11.5" fill="#9AA5B1">11 services + Redis</text>
    <text x="1178" y="260" font-size="11.5" fill="#9AA5B1">serve traffic in webapps.</text>
    <line x1="1178" y1="308" x2="1347" y2="308" stroke="#232A35" stroke-width="1"/>
    <rect x="1178" y="322" width="163" height="26" rx="13" fill="#10141A" stroke="#2A313D" stroke-width="1"/>
    <text x="1259.5" y="339" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#C7CFD8">frontend &#8594; LoadBalancer</text>
  </g>

  <!-- arrows between cards -->
  <g fill="none" stroke="#4A5568" stroke-width="1.8" stroke-linecap="round">
    <path d="M250,245 L259,245 M255,240 L260,245 L255,250"/>
    <path d="M474,245 L483,245 M479,240 L484,245 L479,250"/>
    <path d="M698,245 L707,245 M703,240 L708,245 L703,250"/>
    <path d="M922,245 L931,245 M927,240 L932,245 L927,250"/>
    <path d="M1146,245 L1155,245 M1151,240 L1156,245 L1151,250"/>
  </g>

  <!-- ===================== INCREMENTAL BUILD, AT A GLANCE ===================== -->
  <text x="40" y="404" font-size="12.5" font-weight="700" letter-spacing="1" fill="#2DD8B8">THIS SCAN, ONLY 3 OF 11 BRANCHES REBUILT</text>

  <!-- row 1: active chips -->
  <g>
    <rect x="40" y="420" width="150" height="28" rx="14" fill="#123B34" stroke="#2DD8B8" stroke-width="1.3"/>
    <circle cx="58" cy="434" r="4" fill="#2DD8B8"/>
    <text x="70" y="438" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" fill="#E7ECF2">frontend</text>
  </g>
  <g>
    <rect x="200" y="420" width="150" height="28" rx="14" fill="#123B34" stroke="#2DD8B8" stroke-width="1.3"/>
    <circle cx="218" cy="434" r="4" fill="#2DD8B8"/>
    <text x="230" y="438" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" fill="#E7ECF2">cartservice</text>
  </g>
  <g>
    <rect x="360" y="420" width="150" height="28" rx="14" fill="#123B34" stroke="#2DD8B8" stroke-width="1.3"/>
    <circle cx="378" cy="434" r="4" fill="#2DD8B8"/>
    <text x="390" y="438" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" fill="#E7ECF2">paymentservice</text>
  </g>

  <!-- dimmed chips (unchanged, skipped) -->
  <g stroke="#2A313D" stroke-width="1.3" fill="#161A22">
    <rect x="520" y="420" width="150" height="28" rx="14"/>
    <rect x="680" y="420" width="150" height="28" rx="14"/>
    <rect x="840" y="420" width="150" height="28" rx="14"/>
    <rect x="40" y="458" width="150" height="28" rx="14"/>
    <rect x="200" y="458" width="150" height="28" rx="14"/>
    <rect x="360" y="458" width="190" height="28" rx="14"/>
    <rect x="560" y="458" width="190" height="28" rx="14"/>
    <rect x="760" y="458" width="150" height="28" rx="14"/>
  </g>
  <g fill="none" stroke="#4A5568" stroke-width="1.4">
    <circle cx="538" cy="434" r="4"/>
    <circle cx="698" cy="434" r="4"/>
    <circle cx="858" cy="434" r="4"/>
    <circle cx="58" cy="472" r="4"/>
    <circle cx="218" cy="472" r="4"/>
    <circle cx="378" cy="472" r="4"/>
    <circle cx="578" cy="472" r="4"/>
    <circle cx="778" cy="472" r="4"/>
  </g>
  <g font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" fill="#6B7682">
    <text x="550" y="438">adservice</text>
    <text x="710" y="438">checkoutservice</text>
    <text x="870" y="438">currencyservice</text>
    <text x="70" y="476">emailservice</text>
    <text x="230" y="476">loadgenerator</text>
    <text x="390" y="476">productcatalogservice</text>
    <text x="590" y="476">recommendationservice</text>
    <text x="790" y="476">shippingservice</text>
  </g>

  <!-- legend -->
  <circle cx="1050" cy="428" r="4" fill="#2DD8B8"/>
  <text x="1062" y="432" font-size="11.5" fill="#C7CFD8">rebuilt this run</text>
  <circle cx="1050" cy="466" r="4" fill="none" stroke="#4A5568" stroke-width="1.4"/>
  <text x="1062" y="470" font-size="11.5" fill="#C7CFD8">unchanged &#8212; skipped</text>

  <!-- footer -->
  <line x1="40" y1="522" x2="1360" y2="522" stroke="#2A313D" stroke-width="1"/>
  <text x="40" y="548" font-size="12.5" fill="#9AA5B1">Independent branches, independent images, one shared Kubernetes namespace.</text>
  <text x="1360" y="548" text-anchor="end" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" fill="#4A5568">EKS-1 &#183; ap-south-1 &#183; webapps</text>
</svg>
