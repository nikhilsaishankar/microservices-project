  <rect x="40" y="320" width="260" height="32" rx="16" fill="#BFF3E2"/>
  <text x="170" y="341" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E7C63" letter-spacing="0.4">WHAT STARTS A BUILD</text>
