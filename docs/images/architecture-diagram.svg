      <circle cx="16" cy="16" r="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.7"/>
      <line x1="16" y1="16" x2="24.5" y2="7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="16" cy="16" r="1.8" fill="currentColor"/>
